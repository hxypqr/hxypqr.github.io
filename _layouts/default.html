<!DOCTYPE html>
<html lang="{% if page.homepage %}en{% else %}zh-CN{% endif %}">
  <head>
    {% assign asset_version = site.time | date: "%s" %}
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if page.description %}
      <meta name="description" content="{{ page.description | escape }}">
    {% endif %}
    {% if page.social_image %}
      <meta property="og:type" content="website">
      <meta property="og:title" content="{{ page.title | escape }}">
      <meta property="og:description" content="{{ page.description | escape }}">
      <meta property="og:url" content="{{ page.url | absolute_url }}">
      <meta property="og:image" content="{{ page.social_image | absolute_url }}">
      <meta property="og:image:alt" content="Portrait and title for {{ page.title | escape }}">
      <meta name="twitter:card" content="summary_large_image">
      <meta name="twitter:title" content="{{ page.title | escape }}">
      <meta name="twitter:description" content="{{ page.description | escape }}">
      <meta name="twitter:image" content="{{ page.social_image | absolute_url }}">
    {% endif %}
    {% include head-custom.html %}
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}?v={{ asset_version }}">
    <link rel="stylesheet" href="{{ '/assets/css/equations.css' | relative_url }}?v={{ asset_version }}">
    {% if page.homepage %}
      <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}?v={{ asset_version }}">
    {% endif %}
  </head>
  <body{% if page.homepage %} class="homepage"{% endif %}>
    <header class="site-header">
      <div class="wrapper">
        <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a class="page-link" href="{{ "/" | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
          <a class="page-link" href="{{ "/research/" | relative_url }}"{% if page.url == "/research/" %} aria-current="page"{% endif %}>Research</a>
          <a class="page-link" href="{{ "/blog/" | relative_url }}"{% if page.url == "/blog/" %} aria-current="page"{% endif %}>Blog</a>
        </nav>
      </div>
    </header>

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <p>&copy; {{ site.title }}.</p>
      </div>
    </footer>
    <script src="{{ "/assets/js/main.js" | relative_url }}?v={{ asset_version }}"></script>
  </body>
</html>
